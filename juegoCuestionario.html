        /* Utilidad: Mezclar array (Fisher-Yates) */
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        /* Iniciar nueva sesión con 10 preguntas aleatorias */
        function startQuizSession() {
            // Selecciona 10 preguntas al azar del pool
            const shuffledPool = shuffle(QUESTION_POOL);
            sessionQuestions = shuffledPool.slice(0, Math.min(QUESTIONS_PER_GAME, shuffledPool.length));

            currentIndex = 0;
            score = 0;
            isLocked = false;

            dom.result.hidden = true;
            dom.stage.hidden = false;
            dom.progressFill.style.width = '0%';

            renderQuestion();
        }

        function updateHud(answered = false) {
            const total = sessionQuestions.length;
            const displayIndex = Math.min(currentIndex + 1, total);
            const padIndex = String(displayIndex).padStart(2, '0');
            dom.counter.textContent = `Pregunta ${padIndex} / ${total}`;
            dom.score.textContent = `Aciertos: ${score}`;

            const progress = ((currentIndex + (answered ? 1 : 0)) / total) * 100;
            dom.progressFill.style.width = progress + '%';
        }

        /* Renderizar pregunta actual */
        function renderQuestion() {
            isLocked = false;
            const total = sessionQuestions.length;
            const q = sessionQuestions[currentIndex];

            updateHud(false);

            dom.questionNum.textContent = `// PREGUNTA NUMERO ${String(currentIndex + 1).padStart(2, '0')} · AKIBA ZONE`;
            dom.questionText.textContent = q.question;

            dom.feedback.textContent = '';
            dom.feedback.className = 'quiz-feedback';

            dom.answers.className = 'quiz-answers-grid';
            dom.answers.innerHTML = '';

            // Barajar las 4 opciones de la pregunta
            const shuffledAnswers = shuffle(q.answers);

            shuffledAnswers.forEach((ans, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'quiz-opt';
                btn.innerHTML = `
                    <span class="quiz-opt__badge">${LABELS[idx] || (idx + 1)}</span>
                    <span class="quiz-opt__text">${escapeHtml(ans.text)}</span>
                `;

                btn.addEventListener('click', () => handleSelectAnswer(btn, ans, shuffledAnswers));
                dom.answers.appendChild(btn);
            });
        }

        /* Selección de respuesta */
        function handleSelectAnswer(selectedBtn, answer, allAnswers) {
            if (isLocked) return;
            isLocked = true;

            dom.answers.classList.add('is-locked');
            const buttons = Array.from(dom.answers.children);

            if (answer.correct) {
                selectedBtn.classList.add('is-correct');
                score++;
                dom.feedback.textContent = '[RESPUESTA CORRECTA]';
                dom.feedback.className = 'quiz-feedback ok';
            } else {
                selectedBtn.classList.add('is-wrong');
                // Revelar la opción correcta en verde
                buttons.forEach((b, i) => {
                    if (allAnswers[i].correct) {
                        b.classList.add('is-correct');
                    }
                });
                const rightAnswerText = allAnswers.find(a => a.correct).text;
                dom.feedback.textContent = `[RESPUESTA INCORRECTA // Correcta: ${rightAnswerText}]`;
                dom.feedback.className = 'quiz-feedback ko';
            }

            updateHud(true);

            // Transición automática a la siguiente pregunta
            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= sessionQuestions.length) {
                    showFinalResult();
                } else {
                    renderQuestion();
                }
            }, 1600);
        }

        /* Pantalla de resultados */
        function showFinalResult() {
            dom.progressFill.style.width = '100%';
            dom.counter.textContent = 'COMPLETADO';
            dom.score.textContent = `Aciertos: ${score}`;

            dom.stage.hidden = true;
            dom.result.hidden = false;

            dom.finalScore.textContent = score;
            dom.finalOf.textContent = `de ${sessionQuestions.length} aciertos`;

            const ratio = score / sessionQuestions.length;
            let rank, title, msg;

            if (ratio === 1) {
                rank = '// COMPLETADO · RANGO S';
                title = '¡Eres un verdadero otaku!';
                msg = '10 de 10, ¡perfecto! Llevas años en esto o tienes muy buena memoria, ¡has pasado la prueba!';
            } else if (ratio >= 0.8) {
                rank = '// COMPLETADO · RANGO A';
                title = '¡Estas muy cerca de la gloria!';
                msg = '¡Casi perfecto! Pueden ser los nervios, las preguntas trampa o ese anime en tu lista de pendientes, ¡sigue intentándolo!';
            } else if (ratio >= 0.6) {
                rank = '// COMPLETADO · RANGO B';
                title = '¡Muy buen trabajo!';
                msg = 'Has caído en algunas de las trampas, pero has superado muchas preguntas con éxito, ¡Vas por buen camino!';
            } else if (ratio >= 0.4) {
                rank = '// COMPLETADO · RANGO C';
                title = 'Aún te queda por aprender';
                msg = 'Eres más bien un principiante, aunque sabes más de lo que parece. Sigue intentandolo y alcanzarás la gloria.';
            } else {
                rank = '// COMPLETADO · RANGO D';
                title = 'Otaku principiante';
                msg = 'Totalmente nuevo al mundillo, pero no te preocupes, ¡faltan muchas aventuras por ver!';
            }

            dom.rankBadge.textContent = rank;
            dom.finalTitle.textContent = title;
            dom.finalMsg.textContent = msg;
        }

        /* Eventos */
        dom.replayBtn.addEventListener('click', startQuizSession);

        /* Arranque automático */
        startQuizSession();
    </script>
</body>

</html>
