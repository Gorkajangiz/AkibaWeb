    /* ============================================================
       CONFIGURACIÓN DEL JUEGO
       ============================================================ */
    const FRAMES_PER_GAME = 10;
    const LABELS = ['01', '02', '03', '04'];

    let sessionFrames = [];
    let currentIndex = 0;
    let score = 0;
    let isLocked = false;

    /* Referencias del DOM */
    const dom = {
      counter: document.getElementById('counter'),
      score: document.getElementById('score'),
      progressFill: document.getElementById('progressFill'),
      stage: document.getElementById('stage'),
      frameBadge: document.getElementById('frameBadge'),
      frameImg: document.getElementById('frameImg'),
      answers: document.getElementById('answers'),
      feedback: document.getElementById('feedback'),
      result: document.getElementById('result'),
      rankBadge: document.getElementById('rankBadge'),
      finalScore: document.getElementById('finalScore'),
      finalOf: document.getElementById('finalOf'),
      finalTitle: document.getElementById('finalTitle'),
      finalMsg: document.getElementById('finalMsg'),
      replayBtn: document.getElementById('replayBtn')
    };

    /* Utilidad: Mezclar array (Fisher-Yates) */
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* Iniciar nueva sesión con 10 fotogramas aleatorios */
    function startQuizSession() {
      // Selecciona 10 fotogramas al azar del pool
      const shuffledPool = shuffle(FRAME_POOL);
      sessionFrames = shuffledPool.slice(0, Math.min(FRAMES_PER_GAME, shuffledPool.length));

      currentIndex = 0;
      score = 0;
      isLocked = false;

      dom.result.hidden = true;
      dom.stage.hidden = false;
      dom.progressFill.style.width = '0%';

      renderRound();
    }

    /* Actualizar HUD */
    function updateHud(answered = false) {
      const total = sessionFrames.length;
      const displayIndex = Math.min(currentIndex + 1, total);
      const padIndex = String(displayIndex).padStart(2, '0');
      dom.counter.textContent = `Fotograma ${padIndex} / ${total}`;
      dom.score.textContent = `Aciertos: ${score}`;

      const progress = ((currentIndex + (answered ? 1 : 0)) / total) * 100;
      dom.progressFill.style.width = progress + '%';
    }

    /* Renderizar ronda actual */
    function renderRound() {
      isLocked = false;
      const round = sessionFrames[currentIndex];

      updateHud(false);

      dom.frameBadge.textContent = `// FOTOGRAMA ${String(currentIndex + 1).padStart(2, '0')} · AKIBA ZONE`;
      dom.frameImg.src = round.image;
      dom.frameImg.alt = `Fotograma ${currentIndex + 1} del anime a adivinar`;

      dom.feedback.textContent = '';
      dom.feedback.className = 'quiz-feedback';

      dom.answers.className = 'quiz-answers-grid';
      dom.answers.innerHTML = '';

      // Barajar las 4 opciones
      const shuffledAnswers = shuffle(round.answers);

      shuffledAnswers.forEach((ans, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quiz-opt';
        btn.innerHTML = `
          <span class="quiz-opt__badge">${LABELS[idx] || (idx + 1)}</span>
          <span class="quiz-opt__text">${escapeHtml(ans.text)}</span>
        `;

        btn.addEventListener('click', () => handleSelectAnswer(btn, ans, shuffledAnswers));
        dom.answers.appendChild(btn);
      });
    }

    /* Selección de respuesta */
    function handleSelectAnswer(selectedBtn, answer, allAnswers) {
      if (isLocked) return;
      isLocked = true;

      dom.answers.classList.add('is-locked');
      const buttons = Array.from(dom.answers.children);

      if (answer.correct) {
        selectedBtn.classList.add('is-correct');
        score++;
        dom.feedback.textContent = '[RESPUESTA CORRECTA]';
        dom.feedback.className = 'quiz-feedback ok';
      } else {
        selectedBtn.classList.add('is-wrong');
        // Revelar la opción correcta en verde
        buttons.forEach((b, i) => {
          if (allAnswers[i].correct) {
            b.classList.add('is-correct');
          }
        });
        const rightAnswerText = allAnswers.find(a => a.correct).text;
        dom.feedback.textContent = `[RESPUESTA INCORRECTA // Correcta: ${rightAnswerText}]`;
        dom.feedback.className = 'quiz-feedback ko';
      }

      updateHud(true);

      // Transición automática a la siguiente ronda
      setTimeout(() => {
        currentIndex++;
        if (currentIndex >= sessionFrames.length) {
          showFinalResult();
        } else {
          renderRound();
        }
      }, 1600);
    }

    /* Pantalla de resultados */
    function showFinalResult() {
      dom.progressFill.style.width = '100%';
      dom.counter.textContent = 'COMPLETADO';
      dom.score.textContent = `Aciertos: ${score}`;

      dom.stage.hidden = true;
      dom.result.hidden = false;

      dom.finalScore.textContent = score;
      dom.finalOf.textContent = `de ${sessionFrames.length} aciertos`;

      const ratio = score / sessionFrames.length;
      let rank, title, msg;

      if (ratio === 1) {
        rank = '// COMPLETADO · RANGO S';
        title = '¡Eres un verdadero otaku!';
        msg = 'Reconoces un fotograma hasta con los ojos cerrados. 10 de 10, ¡perfecto!';
      } else if (ratio >= 0.8) {
        rank = '// COMPLETADO · RANGO A';
        title = '¡Muy buen ojo!';
        msg = 'Tienes la retina entrenada. Poco se te escapa, ¡casi perfecto!';
      } else if (ratio >= 0.6) {
        rank = '// COMPLETADO · RANGO B';
        title = '¡Buen trabajo!';
        msg = 'Has acertado la mayoría. Alguno se te ha escapado, pero vas por buen camino.';
      } else if (ratio >= 0.4) {
        rank = '// COMPLETADO · RANGO C';
        title = 'Toca maratón';
        msg = 'Un fin de semana de anime y esto cambia por completo. ¡Sigue entrenando ese ojo!';
      } else {
        rank = '// COMPLETADO · RANGO D';
        title = 'Cero absoluto';
        msg = 'Pero oye, has jugado hasta el final. Eso ya es algo. ¡A ver más anime!';
      }

      dom.rankBadge.textContent = rank;
      dom.finalTitle.textContent = title;
      dom.finalMsg.textContent = msg;
    }

    /* Eventos */
    dom.replayBtn.addEventListener('click', startQuizSession);

    /* Arranque automático */
    startQuizSession();
